services:
  slm-gateway:
    container_name: slm-gateway
    image: slm-app:local
    command: node scripts/auth-gateway.mjs
    ports:
      - "8086:3001"
    env_file:
      - .env.local
    environment:
      AUTH_GATEWAY_APP_ORIGIN: http://slm-app:3000
      AUTH_GATEWAY_HOST: "0.0.0.0"
      AUTH_GATEWAY_PORT: "3001"
    depends_on:
      slm-app:
        condition: service_started

  slm-app:
    container_name: slm-app
    image: slm-app:local
    build: .
    expose:
      - "3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://slm:slm@slm-postgres:5432/slm?schema=public
    depends_on:
      slm-postgres:
        condition: service_healthy
    volumes:
      - slm_data:/app/data

  db-migrate:
    image: slm-app:local
    build: .
    command: npm run db:migrate:deploy
    profiles:
      - tools
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://slm:slm@slm-postgres:5432/slm?schema=public
    depends_on:
      slm-postgres:
        condition: service_healthy
    volumes:
      - slm_data:/app/data

  db-seed-owner:
    image: slm-app:local
    build: .
    command: npm run db:seed-owner
    profiles:
      - tools
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://slm:slm@slm-postgres:5432/slm?schema=public
    depends_on:
      slm-postgres:
        condition: service_healthy

  db-import:
    image: slm-app:local
    build: .
    command: npm run db:migrate:json
    profiles:
      - tools
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://slm:slm@slm-postgres:5432/slm?schema=public
    depends_on:
      slm-postgres:
        condition: service_healthy
    volumes:
      - slm_data:/app/data

  db-verify:
    image: slm-app:local
    build: .
    command: npm run db:verify
    profiles:
      - tools
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://slm:slm@slm-postgres:5432/slm?schema=public
    depends_on:
      slm-postgres:
        condition: service_healthy

  slm-postgres:
    container_name: slm-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slm
      POSTGRES_USER: slm
      POSTGRES_PASSWORD: slm
    volumes:
      - slm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slm -d slm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  slm_data:
  slm_postgres:
