openapi: 3.1.0
info:
  title: SLM Internal API
  version: 1.0.0
  description: >-
    API internal untuk operasional SLM. Semua response JSON bisnis memakai wrapper success/data/message. Error integrasi MJ meliputi AUTH_INVALID, RATE_LIMITED, VALIDATION_FAILED, REFERENCE_CONFLICT, CUSTOMER_INVALID, PRODUCT_INVALID, ACCOUNT_INVALID, INVOICE_LOCKED, PAYMENT_EXCEEDS_REMAINING, PAYMENT_REFERENCE_CONFLICT, AJ_TIMEOUT, AJ_UPSTREAM_ERROR, AJ_CONTRACT_PENDING, dan INTERNAL_ERROR.
servers:
  - url: http://localhost:3000
security:
  - localSessionCookie: []
components:
  securitySchemes:
    localSessionCookie:
      type: apiKey
      in: cookie
      name: aneka_jaya_session
      description: Session httpOnly hasil login internal di /login.
    demoRoleCookie:
      type: apiKey
      in: cookie
      name: aneka_jaya_role
      description: Cookie role demo untuk mode non-production.
    trustedHeaders:
      type: apiKey
      in: header
      name: x-aneka-user-id
      description: Header user dari reverse proxy atau SSO terpercaya.
    cronSecret:
      type: apiKey
      in: header
      name: x-cron-secret
    mjBearer:
      type: http
      scheme: bearer
      bearerFormat: SLM integration token
      description: Token server-to-server yang diprovision satu kali, disimpan sebagai SHA-256 hash, dipisahkan antara sandbox/production, dapat dicabut, kedaluwarsa, dan dirotasi.
  schemas:
    ApiSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data: {}
    ApiError:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
        details: {}
    SalesItem:
      type: object
      required: [productRef, quantity, unitPrice]
      properties:
        productRef:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        discount:
          type: number
    SaleInput:
      type: object
      required: [saleDate, customerName, customerLocation, shippingMethod, paymentMethod, items]
      properties:
        saleDate:
          type: string
          format: date
        transactionAt:
          type: string
          format: date-time
          description: Waktu transaksi. Nilai tanpa offset ditafsirkan sebagai Asia/Jakarta.
        deliveryAt:
          type: string
          format: date-time
          description: Waktu kirim opsional. Tidak boleh sebelum transactionAt dan nilai tanpa offset ditafsirkan sebagai Asia/Jakarta.
        deliveryDate:
          type: string
          format: date
          deprecated: true
          description: Kompatibilitas integrasi lama; gunakan deliveryAt untuk transaksi baru.
        tipeId:
          type: string
        customerName:
          type: string
        customerLocation:
          type: string
        shippingMethod:
          type: string
        paymentMethod:
          type: string
          enum: [Cash, TF, Tempo, Other]
        dueDate:
          type: string
          format: date
        initialPaymentAmount:
          type: number
          minimum: 0
          description: DP untuk transaksi Tempo; harus lebih kecil dari total invoice.
        initialPaymentMethod:
          type: string
          enum: [Cash, TF, Other]
        initialPaymentRekeningId:
          type: string
        initialPaymentRekeningNameSnapshot:
          type: string
          readOnly: true
        initialPaymentNotes:
          type: string
        rekeningId:
          type: string
        transferAccount:
          type: string
        notes:
          type: string
        isTestTransaction:
          type: boolean
          description: Hanya Owner; menandai transaksi tipe ERP seperti AJ sebagai UAT dengan referensi TEST yang unik.
        items:
          type: array
          items:
            $ref: "#/components/schemas/SalesItem"
    ExpenseInput:
      type: object
      required: [expenseDate, category, vendorName, description, amount, paymentMethod, rekeningId, rekeningNameSnapshot]
      properties:
        expenseDate:
          type: string
          format: date
        tipeId:
          type: string
        category:
          type: string
        vendorName:
          type: string
        description:
          type: string
        amount:
          type: number
        paymentMethod:
          type: string
        rekeningId:
          type: string
        rekeningNameSnapshot:
          type: string
        coaId:
          type: string
          default: Kas
        coaNameSnapshot:
          type: string
          default: Kas
        attachmentUrl:
          type: string
        notes:
          type: string
    OperationalProfitSetting:
      type: object
      required: [grossProfitPercent]
      properties:
        grossProfitPercent:
          type: number
          minimum: 0
          maximum: 100
    ErpSyncSetting:
      type: object
      required: [autoSyncAfterSalesEdit]
      properties:
        autoSyncAfterSalesEdit:
          type: boolean
          description: Jika true, edit transaksi penjualan ERP langsung menjalankan retry sinkronisasi setelah data lokal tersimpan.
    CancelInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
    StockAdjustmentInput:
      type: object
      required: [warehouseId, adjustmentType, reason, items]
      properties:
        adjustmentNumber:
          type: string
        adjustmentDate:
          type: string
          format: date
        warehouseId:
          type: integer
        adjustmentType:
          type: string
          enum: [increase, decrease]
        reason:
          type: string
        notes:
          type: string
        createdBy:
          type: integer
        approvedBy:
          type: integer
        approveNow:
          type: boolean
          default: true
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, rakId, differenceQty]
            properties:
              productId:
                type: integer
              rakId:
                type: integer
              currentQty:
                type: number
              adjustedQty:
                type: number
              differenceQty:
                type: number
              unitCost:
                type: number
              differenceValue:
                type: number
              notes:
                type: string
    ProductInput:
      type: object
      required: [code, name, category, unit, sellingPrice, costPrice]
      properties:
        code:
          type: string
        name:
          type: string
        category:
          type: string
        unit:
          type: string
        sellingPrice:
          type: number
        costPrice:
          type: number
        brand:
          type: string
        initialStock:
          type: number
        warehouse:
          type: string
        rack:
          type: string
        minimumStock:
          type: number
    ProductListItem:
      type: object
      required: [id, code, name, updatedAt]
      description: Field daftar produk untuk tabel Stock Barang. Field nullable berarti ERP tidak mengirim nilai valid dan UI harus menampilkan "—".
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        category:
          type: [string, "null"]
        sellingPrice:
          type: [number, "null"]
        minimumStock:
          type: [number, "null"]
        isActive:
          type: [boolean, "null"]
        updatedAt:
          type: string
        dataQualityWarnings:
          type: array
          items:
            type: string
    ProductListMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    StockItem:
      type: object
      required: [id, productCode, productName]
      description: Field stok ERP. Qty/minimum nullable dibedakan dari angka 0 agar kegagalan sinkronisasi tidak terlihat sebagai stok nol.
      properties:
        id:
          type: string
        productCode:
          type: string
        productName:
          type: string
        warehouse:
          type: [string, "null"]
        quantity:
          type: [number, "null"]
        unit:
          type: [string, "null"]
        minimumStock:
          type: [number, "null"]
        rack:
          type: string
        updatedAt:
          type: string
        dataQualityWarnings:
          type: array
          items:
            type: string
    ApprovalAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
        reason:
          type: string
    TempoPaymentInput:
      type: object
      required: [paymentDate, amountPaid, rekeningId]
      properties:
        paymentDate:
          type: string
          format: date
        amountPaid:
          type: number
        paymentMethod:
          type: string
          enum: [Cash, TF, Other]
        rekeningId:
          type: string
        attachmentUrl:
          type: string
        notes:
          type: string
    TempoActionInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    MjInvoiceInput:
      oneOf:
        - $ref: "#/components/schemas/MjSlmProcessAjInput"
        - $ref: "#/components/schemas/MjAjAlreadyProcessedInput"
        - $ref: "#/components/schemas/MjRecordOnlyInput"
      discriminator: { propertyName: processing_mode }
    MjInvoiceCommon:
      type: object
      required: [source, processing_mode, external_reference, invoice_reference, invoice_date, currency, bookkeeping_type_code, customer, payment, items, subtotal, total]
      properties:
        source: { type: string, const: MJ }
        processing_mode: { type: string, enum: [slm_process_aj, aj_already_processed, record_only] }
        external_reference: { type: string, maxLength: 150 }
        invoice_reference: { type: string, maxLength: 100 }
        invoice_date: { type: string, format: date }
        currency: { type: string, const: IDR }
        bookkeeping_type_code: { type: string }
        customer:
          oneOf:
            - type: object
              required: [mode, customer_id]
              properties: { mode: { const: existing }, customer_id: { type: [string, integer] }, name: { type: string } }
            - type: object
              required: [mode, external_id, name, address]
              properties: { mode: { const: manual }, external_id: { type: string }, name: { type: string }, address: { type: string } }
        subtotal: { type: number, minimum: 0 }
        discount: { type: number, minimum: 0, default: 0 }
        total: { type: number, minimum: 0 }
        notes: { type: string }
        metadata: { type: object, additionalProperties: true }
    MjAjItem:
      type: object
      required: [external_product_id, warehouse_id, quantity, unit_price, subtotal]
      properties:
        external_product_id: { type: [string, integer] }
        warehouse_id: { type: [string, integer] }
        warehouse_name: { type: string }
        rack_id: { type: [string, integer] }
        rack_name: { type: string }
        sku: { type: string }
        product_name: { type: string }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit_price: { type: number, minimum: 0 }
        discount: { type: number, minimum: 0, default: 0 }
        subtotal: { type: number, minimum: 0 }
    MjRecordOnlyItem:
      type: object
      required: [product_reference, product_name, quantity, unit_price, subtotal]
      properties:
        product_reference: { type: string }
        product_name: { type: string }
        external_product_id: { type: [string, integer] }
        warehouse_id: { type: [string, integer] }
        warehouse_name: { type: string }
        rack_id: { type: [string, integer] }
        rack_name: { type: string }
        unit: { type: string }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit_price: { type: number, minimum: 0 }
        discount: { type: number, minimum: 0, default: 0 }
        subtotal: { type: number, minimum: 0 }
    MjAjAccount:
      oneOf:
        - type: object
          required: [mode, rekening_id]
          properties: { mode: { const: slm }, rekening_id: { type: string } }
        - type: object
          required: [mode, aj_coa_reference]
          properties: { mode: { const: manual }, aj_coa_reference: { type: string }, name: { type: string } }
    MjLocalAccount:
      oneOf:
        - type: object
          required: [mode, rekening_id]
          properties: { mode: { const: slm }, rekening_id: { type: string } }
        - type: object
          required: [mode, account_reference, name]
          properties: { mode: { const: manual }, account_reference: { type: string }, name: { type: string } }
    MjPayment:
      type: object
      required: [method, status, paid_amount]
      properties:
        method: { type: string, enum: [Cash, TF, Tempo] }
        status: { type: string, enum: [paid, partial, unpaid] }
        paid_amount: { type: number, minimum: 0 }
        due_date: { type: string, format: date }
        account: { oneOf: [{ $ref: "#/components/schemas/MjAjAccount" }, { $ref: "#/components/schemas/MjLocalAccount" }] }
    MjSlmProcessAjInput:
      allOf:
        - $ref: "#/components/schemas/MjInvoiceCommon"
        - type: object
          properties:
            processing_mode: { const: slm_process_aj }
            payment: { $ref: "#/components/schemas/MjPayment" }
            items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MjAjItem" } }
    MjAjAlreadyProcessedInput:
      allOf:
        - $ref: "#/components/schemas/MjInvoiceCommon"
        - type: object
          required: [aj_invoice_number, aj_customer_id]
          properties:
            processing_mode: { const: aj_already_processed }
            aj_invoice_number: { type: string, description: Wajib sama dengan invoice_reference. }
            aj_invoice_id: { type: [string, integer] }
            aj_customer_id: { type: [string, integer] }
            payment: { $ref: "#/components/schemas/MjPayment" }
            items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MjAjItem" } }
    MjRecordOnlyInput:
      allOf:
        - $ref: "#/components/schemas/MjInvoiceCommon"
        - type: object
          properties:
            processing_mode: { const: record_only }
            payment: { $ref: "#/components/schemas/MjPayment" }
            items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MjRecordOnlyItem" } }
    MjTempoPaymentInput:
      type: object
      required: [payment_reference, payment_date, amount, payment_method, account]
      properties:
        payment_reference: { type: string }
        payment_date: { type: string, format: date }
        amount: { type: number, exclusiveMinimum: 0 }
        payment_method: { type: string, enum: [Cash, TF, Other] }
        account: { oneOf: [{ $ref: "#/components/schemas/MjAjAccount" }, { $ref: "#/components/schemas/MjLocalAccount" }] }
        notes: { type: string }
    UserInput:
      type: object
      required: [externalId, name, role]
      properties:
        externalId:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [OWNER, ADMIN, FINANCE, MANAGER, VIEWER]
        isActive:
          type: boolean
        password:
          type: string
          format: password
          description: Wajib saat create user; opsional saat update untuk reset password.
    WhatsAppRecipientInput:
      type: object
      properties:
        id:
          type: string
          description: Wajib untuk update.
        name:
          type: string
        phoneNumber:
          type: string
          description: Nomor WhatsApp format internasional, misalnya 62812...
        isActive:
          type: boolean
        receivesDailyReport:
          type: boolean
        receivesStockAlert:
          type: boolean
        receivesTempoReminder:
          type: boolean
  responses:
    BadRequest:
      description: Request tidak valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Role tidak memiliki permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Data tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BadGateway:
      description: Adapter upstream gagal.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
paths:
  /api/integrations/mj/customers:
    get:
      summary: Cari customer AJ untuk dipilih MJ.
      security: [{ mjBearer: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
      responses: { "200": { description: Daftar customer AJ. }, "401": { description: AUTH_INVALID }, "429": { description: RATE_LIMITED }, "502": { description: AJ_UPSTREAM_ERROR }, "504": { description: AJ_TIMEOUT } }
  /api/integrations/mj/accounts:
    get:
      summary: Daftar rekening SLM dengan reference aman untuk MJ.
      security: [{ mjBearer: [] }]
      parameters:
        - { in: query, name: bookkeeping_type_code, required: true, schema: { type: string } }
      responses: { "200": { description: Rekening aktif dengan flag aj_compatible; COA AJ tidak diekspos. record_only boleh memakai rekening tanpa kompatibilitas AJ. }, "400": { description: VALIDATION_FAILED }, "401": { description: AUTH_INVALID }, "429": { description: RATE_LIMITED } }
  /api/integrations/mj/invoices:
    post:
      summary: Buat atau lanjutkan invoice MJ secara idempotent.
      description: >-
        processing_mode wajib. slm_process_aj menjalankan seluruh tahap AJ; aj_already_processed dan record_only tidak melakukan request AJ. Unique berdasarkan (source, external_reference). Payload sama mengembalikan 200 already_processed; payload atau mode berbeda mengembalikan REFERENCE_CONFLICT. Request AJ timeout setelah 12 detik dan tidak dilakukan di dalam transaksi database.
      security: [{ mjBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MjInvoiceInput" }
            examples:
              slm_process_aj:
                value: { source: MJ, processing_mode: slm_process_aj, external_reference: MJ-2026-0001, invoice_reference: INV-MJ-0001, invoice_date: "2026-08-11", currency: IDR, bookkeeping_type_code: SLM, customer: { mode: existing, customer_id: 25, name: Toko Maju }, payment: { method: TF, status: paid, paid_amount: 100000, account: { mode: slm, rekening_id: bank-operasional } }, items: [{ external_product_id: 10, warehouse_id: 1, quantity: 2, unit_price: 50000, discount: 0, subtotal: 100000 }], subtotal: 100000, discount: 0, total: 100000 }
              aj_already_processed:
                value: { source: MJ, processing_mode: aj_already_processed, external_reference: INV-MJ-0002, invoice_reference: INV-MJ-0002, aj_invoice_number: INV-MJ-0002, aj_invoice_id: 44, aj_customer_id: 25, invoice_date: "2026-08-11", currency: IDR, bookkeeping_type_code: SLM, customer: { mode: existing, customer_id: 25 }, payment: { method: TF, status: paid, paid_amount: 100000, account: { mode: slm, rekening_id: bank-operasional } }, items: [{ external_product_id: 10, warehouse_id: 1, quantity: 2, unit_price: 50000, subtotal: 100000 }], subtotal: 100000, total: 100000 }
              record_only:
                value: { source: MJ, processing_mode: record_only, external_reference: MJ-LOCAL-0003, invoice_reference: INV-MJ-0003, invoice_date: "2026-08-11", currency: IDR, bookkeeping_type_code: SLM, customer: { mode: manual, external_id: C-3, name: Toko Lokal, address: Jakarta }, payment: { method: Cash, status: paid, paid_amount: 100000, account: { mode: manual, account_reference: CASH-MJ, name: Kas MJ } }, items: [{ product_reference: MJ-SKU-1, product_name: Produk Lokal, quantity: 2, unit_price: 50000, subtotal: 100000 }], subtotal: 100000, total: 100000 }
      responses:
        "201": { description: created; semua tahap sukses. }
        "200": { description: already_processed; payload sama dan semua tahap selesai. }
        "400": { description: VALIDATION_FAILED, CUSTOMER_INVALID, PRODUCT_INVALID, atau ACCOUNT_INVALID. }
        "409": { description: REFERENCE_CONFLICT atau INVOICE_LOCKED. }
        "429": { description: RATE_LIMITED. }
        "502": { description: AJ_UPSTREAM_ERROR dengan slm_id, substatus, dan retryable=true. }
        "504": { description: AJ_TIMEOUT dengan slm_id, substatus, dan retryable=true. }
  /api/integrations/mj/invoices/by-reference/{external_reference}:
    get:
      summary: Lookup snapshot dan substatus invoice MJ.
      description: Mengembalikan customer/identitas AJ, remaining Tempo, error terakhir, retryability, dan URL cetak browser/text/PRN. Rate limit read default 300/menit/client.
      security: [{ mjBearer: [] }]
      parameters:
        - { in: path, name: external_reference, required: true, schema: { type: string } }
      responses: { "200": { description: Snapshot invoice. }, "401": { description: AUTH_INVALID }, "404": { description: Invoice tidak ditemukan. }, "429": { description: RATE_LIMITED } }
  /api/integrations/mj/invoices/{external_reference}/payments:
    post:
      summary: Catat pembayaran Tempo idempotent.
      description: slm_process_aj meneruskan pembayaran ke AJ; aj_already_processed dan record_only hanya memperbarui piutang lokal SLM.
      security: [{ mjBearer: [] }]
      parameters:
        - { in: path, name: external_reference, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MjTempoPaymentInput" } } } }
      responses: { "201": { description: Pembayaran dibuat. }, "200": { description: Duplicate sama sudah diproses. }, "400": { description: PAYMENT_EXCEEDS_REMAINING atau validasi. }, "409": { description: PAYMENT_REFERENCE_CONFLICT atau INVOICE_LOCKED. }, "502": { description: AJ_UPSTREAM_ERROR. }, "504": { description: AJ_TIMEOUT. } }
  /api/integrations/mj/invoices/{external_reference}/cancel:
    post:
      summary: Cancel invoice MJ sesuai processing mode.
      description: slm_process_aj meneruskan reversal ke AJ ERP dan membatalkan pembukuan lokal; record_only dan aj_already_processed dibatalkan secara lokal di SLM beserta pembalikan pembayaran Tempo.
      security: [{ mjBearer: [] }]
      parameters:
        - { in: path, name: external_reference, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 } } } } } }
      responses: { "200": { description: Invoice cancelled atau already_cancelled. }, "400": { description: VALIDATION_FAILED. }, "502": { description: AJ_UPSTREAM_ERROR. }, "504": { description: AJ_TIMEOUT. } }
  /api/integrations/mj/invoices/{external_reference}/print:
    get:
      summary: Cetak snapshot invoice MJ sebagai text atau PRN.
      security: [{ mjBearer: [] }]
      parameters:
        - { in: path, name: external_reference, required: true, schema: { type: string } }
        - { in: query, name: format, schema: { type: string, enum: [text, prn], default: text } }
      responses: { "200": { description: Snapshot text/plain atau file PRN. }, "401": { description: AUTH_INVALID }, "404": { description: Invoice tidak ditemukan. } }
  /api/integrations/mj/invoices/{external_reference}/print-events:
    post:
      summary: Sinkronisasi event cetak invoice dari MJ ke SLM.
      description: Mencatat status cetak, waktu, dan kasir/operator pencetak invoice dari sistem MJ ke database SLM dan riwayat transaksi.
      security: [{ mjBearer: [] }]
      parameters:
        - { in: path, name: external_reference, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                printed_at: { type: string, format: date-time, description: Timestamp pencetakan }
                printed_by: { type: string, description: Nama operator/kasir yang mencetak }
                print_count: { type: integer, minimum: 1, description: Jumlah cetak }
                printer_name: { type: string, description: Nama printer }
                format: { type: string, description: Format cetak (dot_matrix, thermal, prn, browser) }
                notes: { type: string, description: Catatan cetak }
      responses: { "200": { description: Event cetak berhasil dicatat. }, "400": { description: VALIDATION_FAILED }, "401": { description: AUTH_INVALID }, "404": { description: Invoice tidak ditemukan. } }
  /api/debug/erp-stock-shape:
    get:
      summary: Audit aman bentuk field ERP produk dan stok.
      description: Development-only untuk OWNER. Output hanya daftar field, tipe data, dan sample pendek tersanitasi; tidak menampilkan token atau payload penuh.
      responses:
        "200":
          description: Shape ERP produk dan stok.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Tidak tersedia di production.
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/health:
    get:
