openapi: 3.1.0
info:
  title: SLM Internal API
  version: 1.0.0
  description: API internal untuk operasional SLM. Semua response JSON bisnis memakai wrapper success/data/message.
servers:
  - url: http://localhost:3000
security:
  - localSessionCookie: []
components:
  securitySchemes:
    localSessionCookie:
      type: apiKey
      in: cookie
      name: aneka_jaya_session
      description: Session httpOnly hasil login internal di /login.
    demoRoleCookie:
      type: apiKey
      in: cookie
      name: aneka_jaya_role
      description: Cookie role demo untuk mode non-production.
    trustedHeaders:
      type: apiKey
      in: header
      name: x-aneka-user-id
      description: Header user dari reverse proxy atau SSO terpercaya.
    cronSecret:
      type: apiKey
      in: header
      name: x-cron-secret
  schemas:
    ApiSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data: {}
    ApiError:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
        details: {}
    SalesItem:
      type: object
      required: [productRef, quantity, unitPrice]
      properties:
        productRef:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        discount:
          type: number
    SaleInput:
      type: object
      required: [saleDate, customerName, customerLocation, shippingMethod, paymentMethod, items]
      properties:
        saleDate:
          type: string
          format: date
        tipeId:
          type: string
        customerName:
          type: string
        customerLocation:
          type: string
        shippingMethod:
          type: string
        paymentMethod:
          type: string
          enum: [Cash, TF, Tempo, Other]
        dueDate:
          type: string
          format: date
        rekeningId:
          type: string
        transferAccount:
          type: string
        notes:
          type: string
        isTestTransaction:
          type: boolean
          description: Hanya Owner; menandai transaksi tipe ERP seperti AJ sebagai UAT dengan referensi TEST yang unik.
        items:
          type: array
          items:
            $ref: "#/components/schemas/SalesItem"
    ExpenseInput:
      type: object
      required: [expenseDate, category, vendorName, description, amount, paymentMethod, rekeningId, rekeningNameSnapshot]
      properties:
        expenseDate:
          type: string
          format: date
        tipeId:
          type: string
        category:
          type: string
        vendorName:
          type: string
        description:
          type: string
        amount:
          type: number
        paymentMethod:
          type: string
        rekeningId:
          type: string
        rekeningNameSnapshot:
          type: string
        coaId:
          type: string
          default: Kas
        coaNameSnapshot:
          type: string
          default: Kas
        attachmentUrl:
          type: string
        notes:
          type: string
    CancelInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
    StockAdjustmentInput:
      type: object
      required: [warehouseId, adjustmentType, reason, items]
      properties:
        adjustmentNumber:
          type: string
        adjustmentDate:
          type: string
          format: date
        warehouseId:
          type: integer
        adjustmentType:
          type: string
          enum: [increase, decrease]
        reason:
          type: string
        notes:
          type: string
        createdBy:
          type: integer
        approvedBy:
          type: integer
        approveNow:
          type: boolean
          default: true
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, rakId, differenceQty]
            properties:
              productId:
                type: integer
              rakId:
                type: integer
              currentQty:
                type: number
              adjustedQty:
                type: number
              differenceQty:
                type: number
              unitCost:
                type: number
              differenceValue:
                type: number
              notes:
                type: string
    ProductInput:
      type: object
      required: [code, name, category, unit, sellingPrice, costPrice]
      properties:
        code:
          type: string
        name:
          type: string
        category:
          type: string
        unit:
          type: string
        sellingPrice:
          type: number
        costPrice:
          type: number
        brand:
          type: string
        initialStock:
          type: number
        warehouse:
          type: string
        rack:
          type: string
        minimumStock:
          type: number
    ProductListItem:
      type: object
      required: [id, code, name, updatedAt]
      description: Field daftar produk untuk tabel Stock Barang. Field nullable berarti ERP tidak mengirim nilai valid dan UI harus menampilkan "—".
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        category:
          type: [string, "null"]
        sellingPrice:
          type: [number, "null"]
        minimumStock:
          type: [number, "null"]
        isActive:
          type: [boolean, "null"]
        updatedAt:
          type: string
        dataQualityWarnings:
          type: array
          items:
            type: string
    ProductListMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    StockItem:
      type: object
      required: [id, productCode, productName]
      description: Field stok ERP. Qty/minimum nullable dibedakan dari angka 0 agar kegagalan sinkronisasi tidak terlihat sebagai stok nol.
      properties:
        id:
          type: string
        productCode:
          type: string
        productName:
          type: string
        warehouse:
          type: [string, "null"]
        quantity:
          type: [number, "null"]
        unit:
          type: [string, "null"]
        minimumStock:
          type: [number, "null"]
        rack:
          type: string
        updatedAt:
          type: string
        dataQualityWarnings:
          type: array
          items:
            type: string
    ApprovalAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
        reason:
          type: string
    TempoPaymentInput:
      type: object
      required: [paymentDate, amountPaid, rekeningId]
      properties:
        paymentDate:
          type: string
          format: date
        amountPaid:
          type: number
        paymentMethod:
          type: string
          enum: [Cash, TF, Other]
        rekeningId:
          type: string
        attachmentUrl:
          type: string
        notes:
          type: string
    TempoActionInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    UserInput:
      type: object
      required: [externalId, name, role]
      properties:
        externalId:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [OWNER, ADMIN, FINANCE, MANAGER, VIEWER]
        isActive:
          type: boolean
        password:
          type: string
          format: password
          description: Wajib saat create user; opsional saat update untuk reset password.
    WhatsAppRecipientInput:
      type: object
      properties:
        id:
          type: string
          description: Wajib untuk update.
        name:
          type: string
        phoneNumber:
          type: string
          description: Nomor WhatsApp format internasional, misalnya 62812...
        isActive:
          type: boolean
        receivesDailyReport:
          type: boolean
        receivesStockAlert:
          type: boolean
        receivesTempoReminder:
          type: boolean
  responses:
    BadRequest:
      description: Request tidak valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Role tidak memiliki permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Data tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BadGateway:
      description: Adapter upstream gagal.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
paths:
  /api/debug/erp-stock-shape:
    get:
      summary: Audit aman bentuk field ERP produk dan stok.
      description: Development-only untuk OWNER. Output hanya daftar field, tipe data, dan sample pendek tersanitasi; tidak menampilkan token atau payload penuh.
      responses:
        "200":
          description: Shape ERP produk dan stok.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Tidak tersedia di production.
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/health:
    get:
      summary: Cek koneksi ERP dan OpenCloud.
      security: []
      responses:
        "200":
          description: Status integrasi.
  /api/docs:
    get:
      summary: Halaman dokumentasi API untuk Owner.
      responses:
        "200":
          description: HTML dokumentasi.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/docs/openapi.json:
    get:
      summary: OpenAPI JSON untuk Owner.
      responses:
        "200":
          description: Dokumen OpenAPI JSON.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/sales:
    post:
      summary: Membuat transaksi penjualan.
      description: Permission penjualan.create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Penjualan dibuat.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/sales/{id}:
    put:
      summary: Update transaksi penjualan aman.
      description: Permission penjualan.manage. Transaksi AJ yang sudah synced ke ERP ditolak sampai tersedia mekanisme koreksi resmi.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "200":
          description: Penjualan diperbarui.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/sales/{id}/cancel:
    post:
      summary: Cancel transaksi penjualan.
      description: Permission penjualan.manage. Cancel adalah void/soft delete dengan alasan, bukan hard delete.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelInput"
      responses:
        "200":
          description: Penjualan dibatalkan.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/sales/{id}/erp-correction:
    post:
      summary: Guard koreksi ERP penjualan.
      description: Permission penjualan.manage. Saat ini selalu mengembalikan 501 ERP_CONTRACT_PENDING sampai kontrak resmi ERP untuk koreksi/cancel invoice tersedia.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          description: Kontrak ERP belum tersedia.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/expenses:
    post:
      summary: Membuat transaksi pengeluaran.
      description: Permission pengeluaran.create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Pengeluaran dibuat.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/expenses/{id}:
    put:
      summary: Update pengeluaran aman.
      description: Permission pengeluaran.manage. Pengeluaran AJ yang sudah synced ke ERP ditolak sampai tersedia mekanisme koreksi resmi.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "200":
          description: Pengeluaran diperbarui.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/expenses/{id}/cancel:
    post:
      summary: Cancel pengeluaran.
      description: Permission pengeluaran.manage. Cancel adalah void/soft delete dengan alasan, bukan hard delete.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelInput"
      responses:
        "200":
          description: Pengeluaran dibatalkan.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/expenses/{id}/erp-correction:
    post:
      summary: Guard koreksi ERP pengeluaran.
      description: Permission pengeluaran.manage. Saat ini selalu mengembalikan 501 ERP_CONTRACT_PENDING sampai kontrak resmi ERP untuk koreksi/cancel Kas & Bank tersedia.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          description: Kontrak ERP belum tersedia.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/products:
    get:
      summary: Daftar produk.
      description: Permission stock.view. Tanpa query mengembalikan array kompatibilitas lama. Dengan page/pageSize/keyword mengembalikan data paginated plus meta.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: keyword
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Daftar produk array atau daftar paginated bila query pagination dikirim.
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/ApiSuccess"
                      - type: object
                        properties:
                          data:
                            type: array
                            items:
                              $ref: "#/components/schemas/ProductListItem"
                  - allOf:
                      - $ref: "#/components/schemas/ApiSuccess"
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [data, meta]
                            properties:
                              data:
                                type: array
                                items:
                                  $ref: "#/components/schemas/ProductListItem"
                              meta:
                                $ref: "#/components/schemas/ProductListMeta"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
    post:
      summary: Membuat produk.
      description: Permission stock.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Produk dibuat.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/products/{id}:
    get:
      summary: Detail produk.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detail produk.
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update produk.
      description: Permission stock.manage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Produk diupdate.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      summary: Nonaktifkan produk.
      description: Permission stock.manage. Delete bersifat soft delete/deactivate ke ERP, bukan hard delete.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Produk dinonaktifkan.
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/stocks:
    get:
      summary: Daftar stok ERP.
      description: Permission stock.view. Jika refresh gagal, halaman mempertahankan data valid terakhir dan menampilkan status data stale; detail teknis ERP tidak diekspos ke pengguna.
      responses:
        "200":
          description: Daftar stok.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/StockItem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/stocks/adjust:
    post:
      summary: Membuat stock adjustment ERP.
      description: Permission stock.adjust. Proxy server-side ke endpoint resmi ERP POST /stock-adjustments; tidak menyimpan qty stok lokal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustmentInput"
      responses:
        "201":
          description: Stock adjustment dibuat di ERP.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/approval/{id}:
    post:
      summary: Approve atau reject approval pending.
      description: Permission approval.approve.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalAction"
      responses:
        "200":
          description: Approval diproses.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/tempo/{id}/pay:
    post:
      summary: Membayar piutang tempo.
      description: Permission tempo.mark_paid.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TempoPaymentInput"
      responses:
        "200":
          description: Pembayaran tempo berhasil.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/tempo/{id}/cancel:
    post:
      summary: Cancel piutang tempo aktif.
      description: Permission tempo.cancel. Wajib alasan cancel.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TempoActionInput"
      responses:
        "200":
          description: Tempo berhasil di-cancel.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/tempo/{id}/write-off:
    post:
      summary: Write-off sisa piutang tempo.
      description: Permission tempo.write_off. Wajib alasan write-off.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TempoActionInput"
      responses:
        "200":
          description: Tempo berhasil di-write-off.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/upload:
    post:
      summary: Upload lampiran transaksi.
      description: Permission upload lampiran untuk Owner/Admin/Finance.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: File terunggah atau URL mock dibuat.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/tipe:
    get:
      summary: Daftar tipe pembukuan.
      responses:
        "200":
          description: Daftar tipe.
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Membuat tipe pembukuan.
      description: Permission settings.tipe.manage.
      responses:
        "201":
          description: Tipe dibuat.
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      summary: Update tipe pembukuan.
      description: Permission settings.tipe.manage.
      responses:
        "200":
          description: Tipe diupdate.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/rekening:
    get:
      summary: Daftar rekening pembayaran.
      responses:
        "200":
          description: Daftar rekening.
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Membuat rekening.
      description: Permission settings.rekening.manage.
      responses:
        "201":
          description: Rekening dibuat.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      summary: Update rekening.
      description: Permission settings.rekening.manage.
      responses:
        "200":
          description: Rekening diupdate.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/auth/login:
    post:
      summary: Login internal.
      description: Menerima email/username dan password, lalu membuat session cookie httpOnly jika credential valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Email atau externalId/username user.
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login berhasil dan session cookie dibuat.
        "401":
          description: Credential tidak valid atau akun terkunci.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/logout:
    post:
      summary: Logout internal.
      description: Menghapus session cookie login internal.
      responses:
        "200":
          description: Session cookie dihapus.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/session/role:
    post:
      summary: Mengubah role demo development teknis.
      description: Hanya aktif ketika mode demo dan `AUTH_ENABLE_DEMO_ROLE_SELECTOR=true`; ditolak pada auth operasional local_credentials.
      responses:
        "200":
          description: Role demo tersimpan di cookie.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/session/logout:
    post:
      summary: Menghapus cookie role demo development teknis.
      description: Hanya aktif ketika mode demo dan `AUTH_ENABLE_DEMO_ROLE_SELECTOR=true`; ditolak pada auth operasional local_credentials.
      responses:
        "200":
          description: Cookie role demo dihapus.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/users:
    get:
      summary: Daftar user.
      description: Permission users.manage.
      responses:
        "200":
          description: Daftar user.
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Membuat user.
      description: Permission users.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User dibuat.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/users/{id}:
    put:
      summary: Update user.
      description: Permission users.manage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: User diupdate.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/whatsapp/test:
    post:
      summary: Mengirim pesan WhatsApp test.
      description: Permission settings.whatsapp.manage.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                recipientId:
                  type: string
      responses:
        "200":
          description: Pesan test dikirim.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/whatsapp/recipients:
    post:
      summary: Membuat recipient WhatsApp.
      description: Permission settings.whatsapp.manage. Token provider tetap server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppRecipientInput"
      responses:
        "200":
          description: Recipient dibuat.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      summary: Update atau nonaktifkan recipient WhatsApp.
      description: Permission settings.whatsapp.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppRecipientInput"
      responses:
        "200":
          description: Recipient diupdate.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/jobs/send-daily-report:
    post:
      summary: Cron kirim laporan harian WhatsApp.
      security:
        - cronSecret: []
      responses:
        "200":
          description: Job selesai.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/jobs/send-tempo-reminder:
    post:
      summary: Cron kirim pengingat tempo.
      security:
        - cronSecret: []
      responses:
        "200":
          description: Job selesai.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/jobs/check-stock-alert:
    post:
      summary: Cron cek minimum stock.
      security:
        - cronSecret: []
      responses:
        "200":
          description: Job selesai.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/jobs/retry-erp-sync:
    post:
      summary: Cron retry sinkron ERP.
      security:
        - cronSecret: []
      responses:
        "200":
          description: Job selesai.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/erp-sync/preflight:
    get:
      summary: Preflight konfigurasi ERP Sync.
      description: Permission erp_sync.retry. Mengecek status base URL/auth ERP dan fallback customer tanpa menampilkan token atau payload sensitif.
      responses:
        "200":
          description: Status preflight ERP Sync.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      erp:
                        type: object
                        properties:
                          baseUrlConfigured:
                            type: boolean
                          staticTokenConfigured:
                            type: boolean
                          sessionTokenAvailable:
                            type: boolean
                          authReady:
                            type: boolean
                      fallbackCustomer:
                        type: object
                        properties:
                          configured:
                            type: boolean
                          code:
                            type: string
                          found:
                            type: boolean
                          status:
                            type: string
                            enum: [configured, missing, erp_error]
                          message:
                            type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/erp-sync/sales/{id}/retry:
    post:
      summary: Retry manual sinkron ERP untuk satu transaksi penjualan.
      description: Permission erp_sync.retry. Mengirim ulang transaksi AJ pending/failed ke ERP dan memperbarui status sinkronisasi.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retry berhasil atau transaksi sudah tersinkron.
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: Retry gagal dengan pesan operasional aman.
  /api/erp-sync/expenses/{id}/retry:
    post:
      summary: Retry manual sinkron ERP untuk satu transaksi pengeluaran.
      description: Permission erp_sync.retry. Mengirim ulang pengeluaran AJ pending/failed ke ERP Kas & Bank dan memperbarui status sinkronisasi.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retry berhasil atau pengeluaran sudah tersinkron.
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: Retry gagal dengan pesan operasional aman.
  /api/print/sales/{id}:
    get:
      summary: Preview cetak dot matrix penjualan.
      description: Mengembalikan output dot matrix fixed-width 44 kolom sebagai text/plain atau native ESC/P .prn.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [txt, prn]
            default: txt
      responses:
        "200":
          description: Teks nota penjualan atau file native PRN.
          content:
            text/plain:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
