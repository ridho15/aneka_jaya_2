          schema:
            type: string
            enum: [txt, prn]
            default: txt
      responses:
        "200":
          description: Teks bukti pembayaran tempo atau file native PRN.
          content:
            text/plain:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
